    <script>
      /* Ensure window.fetch has both getter and setter for browser extension compatibility */
      (function() {
        try {
          var _f = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() { return _f; },
            set: function(v) { _f = v; },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          try {
            var _pf = Window.prototype.fetch;
            Object.defineProperty(Window.prototype, 'fetch', {
              get: function() { return _pf; },
              set: function(v) { _pf = v; },
              configurable: true,
              enumerable: true
            });
          } catch (e2) {}
        }
        /* Suppress external chrome-extension injection errors */
        window.addEventListener('error', function(e) {
          if (e.filename && (e.filename.indexOf('chrome-extension://') !== -1 || e.filename.indexOf('moz-extension://') !== -1)) {
            e.preventDefault();
            e.stopPropagation();
            return true;
          }
        }, true);
      })();
    </script>
